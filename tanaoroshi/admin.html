<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棚卸 管理 | エクラン</title>
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #f4f1ea; color: #222; }
  header { background: #3d2f22; color: #fff; padding: 14px 18px; font-size: 20px; font-weight: 700; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 18px; border-bottom: 2px solid #5a4632; padding-bottom: 6px; margin: 26px 0 12px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  button { font-size: 15px; padding: 9px 16px; border-radius: 9px; border: 1px solid #5a4632; background: #5a4632; color: #fff; cursor: pointer; }
  button.sub { background: #fff; color: #5a4632; }
  button.small { padding: 5px 10px; font-size: 13px; }
  button:disabled { opacity: .5; }
  select, input { font-size: 15px; padding: 8px; border: 1px solid #c9bda9; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 6px; text-align: left; vertical-align: middle; }
  th { background: #faf7f2; }
  td input { width: 100%; padding: 6px; font-size: 14px; }
  td input.num { text-align: right; }
  .msg { font-size: 15px; line-height: 1.6; white-space: pre-wrap; padding: 8px 0; }
  .err { color: #b3261e; }
  .stat { display: inline-block; margin-right: 18px; font-size: 15px; }
  .stat b { font-size: 19px; }
  tr.stopped td { color: #aaa; }
  .rowbtns { white-space: nowrap; }
</style>
</head>
<body>
<header>棚卸 管理画面</header>
<main>
  <div id="panel">
    <h2>月次締め</h2>
    <div class="card">
      <div style="margin-bottom:10px;">
        <button class="sub" id="prevM">◀ 前月</button>
        <b id="ymLabel" style="font-size:18px; margin:0 10px;"></b>
        <button class="sub" id="nextM">翌月 ▶</button>
        <button id="reloadStatus" style="margin-left:14px;">状態を更新</button>
      </div>
      <div id="statusBox" class="msg">読み込み中…</div>
      <div style="margin-top:8px;">
        <button id="finKan">神辺店を確定する</button>
        <button id="finKin">木之庄店を確定する</button>
        <button id="makeCsv">弥生CSVを作る（両店）</button>
      </div>
      <div class="msg" id="closeMsg"></div>
      <div class="msg">店舗の確認が終わらない時は、確認ページから代わりに確定できます：
        <a href="confirm.html?store=kannabe" target="_blank">神辺の確認ページ</a> ／
        <a href="confirm.html?store=kinoshou" target="_blank">木之庄の確認ページ</a>
      </div>
    </div>

    <h2>マスターを直す</h2>
    <div class="card">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
        <select id="storeSel"><option value="kannabe">神辺店</option><option value="kinoshou">木之庄店</option></select>
        <select id="vendorSel"></select>
        <button class="sub" id="applyOrderBtn">「順番」どおりに並べ替える</button>
      </div>
      <div style="overflow-x:auto;">
      <table id="masterTable">
        <thead><tr><th style="width:56px;">順番</th><th>品名</th><th style="width:90px;">単価</th><th style="width:70px;">単位</th><th style="width:70px;">内容量</th><th style="width:70px;">端数単位</th><th style="width:70px;">適正数</th><th style="width:70px;">風袋</th><th style="width:150px;">操作</th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
      <div class="msg" id="masterMsg"></div>
      <div style="border-top:1px solid #eee; padding-top:12px; margin-top:6px;">
        <b>品目を追加</b>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
          <input id="addName" placeholder="品名" style="flex:2; min-width:180px;">
          <input id="addPrice" placeholder="単価" type="number" style="width:100px;">
          <input id="addUnit1" placeholder="単位（箱など）" style="width:110px;">
          <input id="addDiv" placeholder="内容量" type="number" style="width:90px;">
          <input id="addUnit2" placeholder="端数単位" style="width:100px;">
          <button id="addBtn">追加する</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzUSSRnDGATrsbjzsiG8hEH20wiD2HzKtlN2CUwOMYEtDUsUadd0Hl3q1Daxrq14ZKSng/exec';
var CODE = sessionStorage.getItem('invAdminCode') || '';
var now = new Date();
var ym = now.getFullYear() * 100 + (now.getMonth() + 1);
var masterItems = [];

function api(body) {
  body.adminCode = CODE;
  return fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'エラー'); return j; });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ymStr() { return String(Math.floor(ym / 100)) + '年' + (ym % 100) + '月分'; }
function ymCode() { return String(ym); }
function shiftMonth(d) { var y = Math.floor(ym / 100), m = ym % 100 + d; if (m < 1) { y--; m = 12; } if (m > 12) { y++; m = 1; } ym = y * 100 + m; loadStatus(); }
document.getElementById('prevM').onclick = function () { shiftMonth(-1); };
document.getElementById('nextM').onclick = function () { shiftMonth(1); };



function statLine(name, s) {
  return '<div><b style="font-size:17px;">' + name + '</b>　' +
    '<span class="stat">読取ページ <b>' + s.pagesRead + '/' + s.pagesTotal + '</b></span>' +
    '<span class="stat">確認待ち <b>' + (s.review + s.drop) + '</b>件</span>' +
    '<span class="stat">確定 <b>' + s.done + '</b>件</span>' +
    '<span class="stat">金額（税抜）<b>' + (s.amount || 0).toLocaleString('ja-JP') + '</b>円</span></div>';
}
function loadStatus() {
  document.getElementById('ymLabel').textContent = ymStr();
  var box = document.getElementById('statusBox');
  api({ action: 'getMonthStatus', ym: ymCode() })
    .then(function (r) { box.innerHTML = statLine('神辺店', r.kannabe) + statLine('木之庄店', r.kinoshou); })
    .catch(function (e) { box.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
}
document.getElementById('reloadStatus').onclick = loadStatus;

function closeAction(action, store, label) {
  var msg = document.getElementById('closeMsg');
  msg.textContent = label + '…';
  var body = { action: action, ym: ymCode(), by: '管理画面' };
  if (store) body.store = store;
  api(body).then(function (r) {
    if (action === 'finalizeMonth') msg.textContent = label + '完了。金額（税抜）' + r.amount.toLocaleString('ja-JP') + '円';
    else msg.innerHTML = label + '完了。<a href="' + esc(r.csvUrl) + '" target="_blank">CSVを開く</a>';
    loadStatus();
  }).catch(function (e) { msg.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
}
document.getElementById('finKan').onclick = function () { closeAction('finalizeMonth', 'kannabe', '神辺店の確定'); };
document.getElementById('finKin').onclick = function () { closeAction('finalizeMonth', 'kinoshou', '木之庄店の確定'); };
document.getElementById('makeCsv').onclick = function () { closeAction('makeCsv', null, '弥生CSVの作成'); };

function curStore() { return document.getElementById('storeSel').value; }
function curVendor() { return document.getElementById('vendorSel').value; }

function loadMaster() {
  api({ action: 'getMaster', store: curStore() }).then(function (r) {
    masterItems = r.items;
    var vsel = document.getElementById('vendorSel');
    var vendors = [];
    masterItems.forEach(function (it) { if (vendors.indexOf(it.vendor) < 0) vendors.push(it.vendor); });
    var cur = vsel.value;
    vsel.innerHTML = vendors.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
    renderMaster();
  }).catch(function (e) { document.getElementById('masterMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
}
function renderMaster() {
  var v = curVendor();
  var tb = document.querySelector('#masterTable tbody');
  tb.innerHTML = '';
  masterItems.filter(function (it) { return it.vendor === v; }).forEach(function (it) {
    var tr = document.createElement('tr');
    if (it.status === '停止') tr.className = 'stopped';
    tr.innerHTML =
      '<td><input class="num" data-k="order" value="' + esc(it.order === null ? '' : it.order) + '"></td>' +
      '<td><input data-k="name" value="' + esc(it.name) + '"></td>' +
      '<td><input class="num" data-k="price" type="number" value="' + esc(it.price === null ? '' : it.price) + '"></td>' +
      '<td><input data-k="unit1" value="' + esc(it.unit1 || '') + '"></td>' +
      '<td><input class="num" data-k="divisor" type="number" value="' + esc(it.divisor === null ? '' : it.divisor) + '"></td>' +
      '<td><input data-k="unit2" value="' + esc(it.unit2 || '') + '"></td>' +
      '<td><input class="num" data-k="tekisei" type="number" value="' + esc(it.tekisei === null ? '' : it.tekisei) + '"></td>' +
      '<td><input class="num" data-k="tare" type="number" value="' + esc(it.tare === null ? '' : it.tare) + '"></td>' +
      '<td class="rowbtns"><button class="small sub mv" data-d="up">↑</button> <button class="small sub mv" data-d="down">↓</button> ' +
      '<button class="small save">保存</button> ' +
      (it.status === '停止' ? '<button class="small sub tog">もどす</button>' : '<button class="small sub tog">やめる</button>') + '</td>';
    tr.querySelector('.save').onclick = function () {
      var fields = {};
      tr.querySelectorAll('input').forEach(function (inp) {
        var k = inp.getAttribute('data-k'), val = inp.value;
        fields[k] = (k === 'name' || k === 'unit1' || k === 'unit2') ? val : (val === '' ? '' : Number(val));
      });
      api({ action: 'updateMasterItem', store: curStore(), row: it.row, fields: fields, by: '管理画面' })
        .then(function () { document.getElementById('masterMsg').textContent = '保存しました：' + it.name; loadMaster(); })
        .catch(function (e) { document.getElementById('masterMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
    };
    tr.querySelector('.tog').onclick = function () {
      api({ action: 'updateMasterItem', store: curStore(), row: it.row, fields: { status: it.status === '停止' ? '使用中' : '停止' }, by: '管理画面' })
        .then(function () { loadMaster(); })
        .catch(function (e) { document.getElementById('masterMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
    };
    tr.querySelectorAll('.mv').forEach(function (b) {
      b.onclick = function () {
        api({ action: 'moveMasterItem', store: curStore(), row: it.row, dir: b.getAttribute('data-d'), by: '管理画面' })
          .then(function () { loadMaster(); })
          .catch(function (e) { document.getElementById('masterMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
      };
    });
    tb.appendChild(tr);
  });
}
document.getElementById('storeSel').onchange = loadMaster;
document.getElementById('vendorSel').onchange = renderMaster;
document.getElementById('applyOrderBtn').onclick = function () {
  api({ action: 'applyOrder', store: curStore(), by: '管理画面' })
    .then(function () { document.getElementById('masterMsg').textContent = '順番どおりに並べ替えました。'; loadMaster(); })
    .catch(function (e) { document.getElementById('masterMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
};
document.getElementById('addBtn').onclick = function () {
  var name = document.getElementById('addName').value.trim();
  if (!name) { document.getElementById('masterMsg').textContent = '品名を入れてください。'; return; }
  api({ action: 'addMasterItem', store: curStore(), vendor: curVendor(), name: name,
    price: document.getElementById('addPrice').value, unit1: document.getElementById('addUnit1').value,
    divisor: document.getElementById('addDiv').value, unit2: document.getElementById('addUnit2').value, by: '管理画面' })
    .then(function () {
      document.getElementById('masterMsg').textContent = '追加しました：' + name;
      document.getElementById('addName').value = ''; document.getElementById('addPrice').value = '';
      loadMaster();
    })
    .catch(function (e) { document.getElementById('masterMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; });
};

loadStatus(); loadMaster();
</script>
</body>
</html>
