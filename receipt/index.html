<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシート撮影</title>
<meta name="theme-color" content="#205c40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レシート撮影">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f4f6f4; color: #222; }
  header { background: #205c40; color: #fff; padding: 16px; font-size: 20px; font-weight: 700; text-align: center; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
  .lead { font-size: 16px; line-height: 1.7; margin: 6px 2px 16px; }
  .bigbtn { display: block; width: 100%; padding: 22px 16px; margin: 12px 0; border: none; border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer; text-align: left; }
  .bigbtn small { display: block; font-size: 14px; font-weight: 400; margin-top: 6px; line-height: 1.5; }
  .credit { background: #205c40; color: #fff; }
  .cash { background: #fff; color: #205c40; border: 2px solid #205c40; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin: 12px 0; }
  .shoot { display: block; width: 100%; padding: 18px; border-radius: 12px; background: #205c40; color: #fff; font-size: 19px; font-weight: 700; text-align: center; cursor: pointer; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; }
  .item img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
  .ok { color: #205c40; font-weight: 700; }
  .err { color: #c0392b; }
  .back { display: inline-block; margin-top: 14px; color: #205c40; font-size: 16px; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 6px 0; }
  details { margin-top: 26px; font-size: 14px; color: #444; line-height: 1.8; }
  summary { cursor: pointer; color: #205c40; font-weight: 700; }
</style>
</head>
<body>
<header>レシート撮影</header>
<main>
  <div id="viewChoice">
    <p class="lead">レシートの写真は、ここ1か所から送ります。<br>どうやって買いましたか？</p>
    <button class="bigbtn credit" id="btnCredit">クレジットカードで買った
      <small>楽天カード・イオンカードなど。撮影だけで終わりです。仕訳は明細のアプリが自動で拾います。</small>
    </button>
    <button class="bigbtn cash" id="btnCash">現金で買った
      <small>経費レシートの画面へ進みます。今までどおりの流れです。</small>
    </button>
    <details>
      <summary>ホーム画面への追加のしかた</summary>
      <p>1. 共有ボタンをタップ<br>2.「ホーム画面に追加」を選ぶ<br>3.「Webアプリとして開く」が出たらONにして「追加」</p>
    </details>
  </div>

  <div id="viewCredit" style="display:none">
    <p class="lead">クレジットカードのレシートを撮ってください。<br>続けて何枚も撮ってから、まとめて送れます。</p>
    <div class="card">
      <div style="background:#10312a;border-radius:12px;overflow:hidden"><video id="cam" autoplay playsinline muted style="width:100%;display:block"></video></div>
      <button class="shoot" id="shootBtn" style="border:none;margin-top:10px;background:#c2410c">📷 撮影する</button>
      <p id="camMsg" style="font-size:13px;color:#555;margin:8px 0 0">撮るたびに下へ溜まっていきます。</p>
      <label class="shoot" for="fileInput" style="background:#e6efec;color:#205c40;margin-top:10px">写真から選ぶ</label>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <div id="list"></div>
      <button class="shoot" id="sendAll" style="border:none;margin-top:12px" disabled>まとめて送る</button>
      <div id="doneMsg" class="ok" style="margin-top:12px"></div>
    </div>
    <button class="back" id="btnBack">← 最初に戻る</button>
  </div>
</main>
<script>
var POOL_URL = 'https://script.google.com/macros/s/AKfycbw8RLwpa_2CJOI4E6buFRkAb6NujYq1mJuCfOW1UnAdVOXyj61N80k4ZdyfnmKgiWEy/exec';
var CASH_URL = 'https://tadashimail9-design.github.io/ecran-apps/receipt-cash/';

document.getElementById('btnCredit').onclick = function () {
  document.getElementById('viewChoice').style.display = 'none';
  document.getElementById('viewCredit').style.display = 'block';
};
document.getElementById('btnCash').onclick = function () { location.href = CASH_URL; };
document.getElementById('btnBack').onclick = function () {
  document.getElementById('viewCredit').style.display = 'none';
  document.getElementById('viewChoice').style.display = 'block';
};

function compress(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var max = 1200;
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, max / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      resolve({ b64: dataUrl.split(',')[1], thumb: dataUrl });
    };
    img.onerror = reject;
    img.src = url;
  });
}

function api(body) {
  return fetch(POOL_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'エラー'); return j; });
}

var tray = [];
var camStream = null;
function updateSendBtn() {
  var n = tray.filter(function (t) { return t.state === 'wait' || t.state === 'fail'; }).length;
  var b = document.getElementById('sendAll');
  b.disabled = !n;
  b.textContent = n ? ('まとめて送る（' + n + '枚）') : 'まとめて送る';
}
function addToTray(thumb, b64) {
  var t = { thumb: thumb, b64: b64, state: 'wait' };
  tray.push(t);
  var row = document.createElement('div');
  row.className = 'item';
  var im = document.createElement('img'); im.src = thumb; row.appendChild(im);
  var st = document.createElement('span'); st.textContent = '送信待ち'; row.appendChild(st);
  var del = document.createElement('button');
  del.textContent = 'やめる';
  del.style.cssText = 'margin-left:auto;background:#fff;color:#205c40;border:1px solid #205c40;border-radius:8px;padding:6px 10px';
  del.onclick = function () { tray = tray.filter(function (x) { return x !== t; }); row.remove(); updateSendBtn(); };
  row.appendChild(del);
  t.st = st; t.del = del;
  document.getElementById('list').appendChild(row);
  updateSendBtn();
}
function startCam() {
  if (camStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('camMsg').textContent = 'この端末ではカメラが使えません。「写真から選ぶ」を使ってください。';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (s) {
    camStream = s;
    document.getElementById('cam').srcObject = s;
  }).catch(function (e) {
    document.getElementById('camMsg').textContent = 'カメラを起動できませんでした。「写真から選ぶ」からも送れます。';
  });
}
document.getElementById('btnCredit').addEventListener('click', startCam);
document.getElementById('shootBtn').onclick = function () {
  var v = document.getElementById('cam');
  if (!camStream || !v.videoWidth) {
    document.getElementById('camMsg').textContent = 'カメラの準備ができていません。少し待ってください。';
    return;
  }
  var max = 1200;
  var scale = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight));
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(v.videoWidth * scale); canvas.height = Math.round(v.videoHeight * scale);
  canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
  var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  addToTray(dataUrl, dataUrl.split(',')[1]);
  document.getElementById('camMsg').textContent = '撮影しました。続けて撮れます。';
};
document.getElementById('fileInput').addEventListener('change', function (ev) {
  var files = Array.prototype.slice.call(ev.target.files || []);
  ev.target.value = '';
  var chain = Promise.resolve();
  files.forEach(function (f) {
    chain = chain.then(function () {
      return compress(f).then(function (c) { addToTray(c.thumb, c.b64); }).catch(function () {});
    });
  });
});
document.getElementById('sendAll').onclick = function () {
  var targets = tray.filter(function (t) { return t.state === 'wait' || t.state === 'fail'; });
  if (!targets.length) return;
  var btn = document.getElementById('sendAll');
  btn.disabled = true;
  var doneMsg = document.getElementById('doneMsg');
  doneMsg.textContent = '';
  var failCount = 0;
  var chain = Promise.resolve();
  targets.forEach(function (t) {
    chain = chain.then(function () {
      t.st.textContent = '送っています…';
      return api({ action: 'uploadReceipt', image: t.b64, mime: 'image/jpeg' }).then(function () {
        t.state = 'done';
        t.st.innerHTML = '<span class="ok">受け付けました</span>';
        if (t.del) t.del.remove();
      }).catch(function (e) {
        t.state = 'fail';
        failCount++;
        t.st.innerHTML = '<span class="err">送れませんでした：' + String(e && e.message || e) + '</span>';
      });
    });
  });
  chain.then(function () {
    if (failCount === 0) {
      doneMsg.textContent = '受け付けました。読み取りは自動で進みます。このまま終わって大丈夫です。';
    } else {
      doneMsg.innerHTML = '<span class="err">送れなかった写真があります。もう一度「まとめて送る」を押してください。</span>';
    }
    updateSendBtn();
  });
};
</script>
</body>
</html>
