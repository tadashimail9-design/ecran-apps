<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシート撮影</title>
<meta name="theme-color" content="#205c40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レシート撮影">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f4f6f4; color: #222; }
  header { background: #205c40; color: #fff; padding: 16px; font-size: 20px; font-weight: 700; text-align: center; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
  .lead { font-size: 16px; line-height: 1.7; margin: 6px 2px 16px; }
  .bigbtn { display: block; width: 100%; padding: 22px 16px; margin: 12px 0; border: none; border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer; text-align: left; }
  .bigbtn small { display: block; font-size: 14px; font-weight: 400; margin-top: 6px; line-height: 1.5; }
  .credit { background: #205c40; color: #fff; }
  .cash { background: #fff; color: #205c40; border: 2px solid #205c40; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin: 12px 0; }
  .shoot { display: block; width: 100%; padding: 18px; border-radius: 12px; background: #205c40; color: #fff; font-size: 19px; font-weight: 700; text-align: center; cursor: pointer; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; }
  .item img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
  .ok { color: #205c40; font-weight: 700; }
  .err { color: #c0392b; }
  .back { display: inline-block; margin-top: 14px; color: #205c40; font-size: 16px; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 6px 0; }
  details { margin-top: 26px; font-size: 14px; color: #444; line-height: 1.8; }
  summary { cursor: pointer; color: #205c40; font-weight: 700; }
</style>
</head>
<body>
<header>レシート撮影</header>
<main>
  <div id="viewChoice">
    <p class="lead">レシートの写真は、ここ1か所から送ります。<br>どうやって買いましたか？</p>
    <button class="bigbtn credit" id="btnCredit">クレジットカードで買った
      <small>楽天カード・イオンカードなど。撮影だけで終わりです。仕訳は明細のアプリが自動で拾います。</small>
    </button>
    <button class="bigbtn cash" id="btnCash">現金で買った
      <small>経費レシートの画面へ進みます。今までどおりの流れです。</small>
    </button>
    <details>
      <summary>ホーム画面への追加のしかた</summary>
      <p>1. 共有ボタンをタップ<br>2.「ホーム画面に追加」を選ぶ<br>3.「Webアプリとして開く」が出たらONにして「追加」</p>
    </details>
  </div>

  <div id="viewCredit" style="display:none">
    <p class="lead">クレジットカードのレシートを撮ってください。<br>何枚でもまとめて送れます。</p>
    <div class="card">
      <label class="shoot" for="fileInput">写真を撮る／選ぶ</label>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <div id="list"></div>
      <div id="doneMsg" class="ok" style="margin-top:12px"></div>
    </div>
    <button class="back" id="btnBack">← 最初に戻る</button>
  </div>
</main>
<script>
var POOL_URL = 'https://script.google.com/macros/s/AKfycbw8RLwpa_2CJOI4E6buFRkAb6NujYq1mJuCfOW1UnAdVOXyj61N80k4ZdyfnmKgiWEy/exec';
var CASH_URL = 'https://script.google.com/macros/s/AKfycbzHCqEvjUTLM5c8BwpjIDKb1D7xpC9CnQbIYBtBc_sUYuuq5OBNA-sxY9wwkDULA6xf5A/exec';

document.getElementById('btnCredit').onclick = function () {
  document.getElementById('viewChoice').style.display = 'none';
  document.getElementById('viewCredit').style.display = 'block';
};
document.getElementById('btnCash').onclick = function () { location.href = CASH_URL; };
document.getElementById('btnBack').onclick = function () {
  document.getElementById('viewCredit').style.display = 'none';
  document.getElementById('viewChoice').style.display = 'block';
};

function compress(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var max = 1200;
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, max / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      resolve({ b64: dataUrl.split(',')[1], thumb: dataUrl });
    };
    img.onerror = reject;
    img.src = url;
  });
}

function api(body) {
  return fetch(POOL_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'エラー'); return j; });
}

var sending = false;
document.getElementById('fileInput').addEventListener('change', function (ev) {
  var files = Array.prototype.slice.call(ev.target.files || []);
  ev.target.value = '';
  if (!files.length || sending) return;
  sending = true;
  document.getElementById('doneMsg').textContent = '';
  var list = document.getElementById('list');
  var chain = Promise.resolve();
  files.forEach(function (f) {
    var row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = '<span>送信の準備中…</span>';
    list.appendChild(row);
    chain = chain.then(function () {
      return compress(f).then(function (c) {
        row.innerHTML = '';
        var im = document.createElement('img'); im.src = c.thumb; row.appendChild(im);
        var st = document.createElement('span'); st.textContent = '送っています…'; row.appendChild(st);
        return api({ action: 'uploadReceipt', image: c.b64, mime: 'image/jpeg' }).then(function () {
          st.innerHTML = '<span class="ok">受け付けました</span>';
        });
      }).catch(function (e) {
        var st2 = document.createElement('span');
        st2.innerHTML = '<span class="err">送れませんでした：' + String(e && e.message || e) + '</span>';
        row.appendChild(st2);
      });
    });
  });
  chain.then(function () {
    sending = false;
    document.getElementById('doneMsg').textContent = '受け付けました。読み取りは自動で進みます。このまま終わって大丈夫です。';
  });
});
</script>
</body>
</html>
