<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>わたしの勤怠</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #f7f3ec; color: #2b2b2b; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 20px; margin: 8px 0 2px; color: #2f5d7d; }
  .sub { font-size: 13px; color: #777; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
  label { font-size: 14px; display: block; margin-bottom: 6px; }
  input[type=text] { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #ccc; border-radius: 10px; }
  button { width: 100%; font-size: 17px; padding: 13px; border: 0; border-radius: 10px; background: #2f5d7d; color: #fff; margin-top: 12px; }
  button:disabled { background: #9db6c6; }
  .msg { font-size: 14px; line-height: 1.7; margin-top: 12px; white-space: pre-line; }
  .err { color: #b3261e; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .name { font-size: 19px; font-weight: 700; }
  .store { font-size: 13px; color: #777; }
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .monthbar .ym { font-size: 18px; font-weight: 700; }
  .nav { width: auto; margin: 0; padding: 8px 16px; font-size: 15px; background: #e8eef2; color: #2f5d7d; }
  .totals { display: flex; gap: 10px; flex-wrap: wrap; }
  .tot { flex: 1 1 30%; background: #f2f6f8; border-radius: 10px; padding: 10px; text-align: center; }
  .tot .k { font-size: 12px; color: #667; }
  .tot .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .bystore { font-size: 13px; color: #555; margin-top: 10px; line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; border-bottom: 1px solid #eee; text-align: center; }
  th { font-size: 12px; color: #778; font-weight: 600; }
  td.d { text-align: left; white-space: nowrap; }
  tr.off td { color: #aaa; }
  .st { font-size: 11px; color: #a15c00; }
  .foot { font-size: 12px; color: #999; line-height: 1.7; margin-top: 14px; }
  .logout { background: none; color: #2f5d7d; font-size: 13px; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>わたしの勤怠</h1>
  <div class="sub">自分のタイムカードの記録が見られます</div>

  <div id="loginCard" class="card" style="display:none">
    <label for="nameInput">名前を入れてください（名簿の名前）</label>
    <input type="text" id="nameInput" autocomplete="name" placeholder="例：山田花子">
    <button id="sendBtn">LINEにリンクを送る</button>
    <div id="loginMsg" class="msg"></div>
    <div class="foot">名前を入れると、あなたのLINEにログイン用のリンクが届きます。リンクをタップすると、このページで自分の記録が見られます（リンクは15分間有効です）。</div>
  </div>

  <div id="mainCard" style="display:none">
    <div class="card">
      <div class="head">
        <div>
          <div class="name" id="staffName"></div>
          <div class="store" id="staffStore"></div>
        </div>
        <button class="logout" id="logoutBtn">ログアウト</button>
      </div>
    </div>
    <div class="card">
      <div class="monthbar">
        <button class="nav" id="prevBtn">◀ 前の月</button>
        <div class="ym" id="ymLabel"></div>
        <button class="nav" id="nextBtn">次の月 ▶</button>
      </div>
      <div class="totals">
        <div class="tot"><div class="k">出勤日数</div><div class="v" id="tDays">-</div></div>
        <div class="tot"><div class="k">実働合計</div><div class="v" id="tWork">-</div></div>
        <div class="tot"><div class="k">給与計算用</div><div class="v" id="tPay">-</div></div>
      </div>
      <div class="bystore" id="byStore"></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th style="text-align:left">日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th></tr></thead>
        <tbody id="rowsBody"></tbody>
      </table>
      <div class="foot">給与計算用は、1日ごとに15分単位で切り捨てた合計です。記録の直しや申告は、今まで通りLINEでお願いします。</div>
    </div>
  </div>
</div>

<script>
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzv31BsMHwTv4A_Ev_7MT23AfHcJqLgBvQQC_OychVcsKDcbY29QafwaotsUWn-9tD25w/exec';
var LS_KEY = 'ecran_my_session';
var curYm = null;

function api(body) {
  return fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function fmtMin(m) {
  if (typeof m !== 'number') return '-';
  var h = Math.floor(m / 60), mm = m % 60;
  return h + ':' + ('0' + mm).slice(-2);
}
function ymNow() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
}
function ymShift(ym, delta) {
  var p = ym.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
}
function showLogin(msg, isErr) {
  document.getElementById('mainCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
  var el = document.getElementById('loginMsg');
  el.textContent = msg || '';
  el.className = 'msg' + (isErr ? ' err' : '');
}
function loadMonth(ym) {
  var session = localStorage.getItem(LS_KEY);
  if (!session) { showLogin(''); return; }
  curYm = ym;
  document.getElementById('ymLabel').textContent = ym.replace('-', '年') + '月';
  document.getElementById('rowsBody').innerHTML = '<tr><td colspan="5">読み込み中…</td></tr>';
  api({ action: 'myData', session: session, ym: ym }).then(function (res) {
    if (!res.ok) {
      if (res.needLogin) { localStorage.removeItem(LS_KEY); showLogin(res.error, true); }
      else document.getElementById('rowsBody').innerHTML = '<tr><td colspan="5">' + res.error + '</td></tr>';
      return;
    }
    document.getElementById('staffName').textContent = res.name + ' さん';
    document.getElementById('staffStore').textContent = res.store || '';
    document.getElementById('tDays').textContent = res.workDays + '日';
    document.getElementById('tWork').textContent = fmtMin(res.totalWorkMin);
    document.getElementById('tPay').textContent = fmtMin(res.payrollMin);
    var bs = [];
    Object.keys(res.byStore || {}).forEach(function (k) { bs.push(k + '：' + fmtMin(res.byStore[k])); });
    document.getElementById('byStore').textContent = bs.length ? '店舗別の実働　' + bs.join('　／　') : '';
    var html = '';
    (res.rows || []).forEach(function (r) {
      var d = new Date(r.date + 'T00:00:00');
      var wd = '日月火水木金土'[d.getDay()];
      var off = (r.status === '公休');
      var st = (!off && r.status && r.status !== '通常') ? '<div class="st">' + r.status + '</div>' : '';
      html += '<tr' + (off ? ' class="off"' : '') + '><td class="d">' + (Number(r.date.slice(8))) + '日（' + wd + '）' + st + '</td>'
        + '<td>' + (r.start || '-') + '</td><td>' + (r.end || '-') + '</td>'
        + '<td>' + (typeof r.brk === 'number' && r.brk ? r.brk + '分' : '-') + '</td>'
        + '<td>' + fmtMin(r.work) + '</td></tr>';
    });
    document.getElementById('rowsBody').innerHTML = html || '<tr><td colspan="5">この月の記録はまだありません</td></tr>';
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('mainCard').style.display = 'block';
  }).catch(function () {
    document.getElementById('rowsBody').innerHTML = '<tr><td colspan="5">通信に失敗しました。もう一度開いてください</td></tr>';
  });
}

document.getElementById('sendBtn').addEventListener('click', function () {
  var name = document.getElementById('nameInput').value.trim();
  var btn = document.getElementById('sendBtn');
  var msg = document.getElementById('loginMsg');
  if (!name) { msg.textContent = '名前を入れてください'; msg.className = 'msg err'; return; }
  btn.disabled = true;
  msg.textContent = '送っています…'; msg.className = 'msg';
  api({ action: 'myRequestLink', name: name }).then(function (res) {
    btn.disabled = false;
    if (res.ok) {
      msg.textContent = 'LINEにリンクを送りました。LINEを開いて、リンクをタップしてください。';
      msg.className = 'msg';
    } else {
      msg.textContent = res.error || '送れませんでした';
      msg.className = 'msg err';
    }
  }).catch(function () {
    btn.disabled = false;
    msg.textContent = '通信に失敗しました。もう一度試してください';
    msg.className = 'msg err';
  });
});
document.getElementById('prevBtn').addEventListener('click', function () { loadMonth(ymShift(curYm, -1)); });
document.getElementById('nextBtn').addEventListener('click', function () { loadMonth(ymShift(curYm, 1)); });
document.getElementById('logoutBtn').addEventListener('click', function () {
  localStorage.removeItem(LS_KEY);
  showLogin('');
});

(function init() {
  var params = new URLSearchParams(location.search);
  var t = params.get('t');
  if (t) {
    api({ action: 'myExchange', token: t }).then(function (res) {
      history.replaceState(null, '', location.pathname);
      if (res.ok) {
        localStorage.setItem(LS_KEY, res.session);
        loadMonth(ymNow());
      } else {
        showLogin(res.error, true);
      }
    }).catch(function () { showLogin('通信に失敗しました。もう一度リンクを取り直してください', true); });
    return;
  }
  if (localStorage.getItem(LS_KEY)) loadMonth(ymNow());
  else showLogin('');
})();
</script>
</body>
</html>
